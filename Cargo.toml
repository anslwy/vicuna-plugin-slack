[package]
name = "vicuna-bridge-slack"
version = "0.1.0"
edition = "2024"
description = "Slack Socket Mode bridge plugin for Vicuna"

[dependencies]
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[profile.release]
opt-level = 3
lto = true
strip = true
